protocol_version: 2.0
protocol_name: stage2_benchmark_protocol
description: >-
  Frozen protocol for stage-2 benchmark evaluation of nonlinear harmony-to-fractal
  mappings. The goal is to compare generator families under controlled mapping,
  perturbation, reproducibility, separability, deformation continuity, and
  bifurcation sensitivity criteria.

scope:
  stage: 2
  objective: >-
    Compare generator classes under identical input registry and fixed mapping
    assumptions in order to identify the best balance between within-class
    cohesion, between-class separability, controlled variability, and robustness.
  exclusions:
    - No learned encoder training inside the benchmark loop.
    - No UI, web wrapper, or presentation layer evaluation.
    - No mixed evaluation of mapping optimization and generator dynamics.

mapping:
  default_mapping_mode: rule_based_mapping
  allowed_modes:
    - rule_based_mapping
    - frozen_encoder_mapping
  encoder_enabled: false
  encoder_version: null
  mapping_version: v1.0
  feature_schema_version: v1.0
  observer_version: v1.0
  distance_metric_version: v1.0
  rules:
    - rule_based_mapping is the default and recommended benchmark mode.
    - frozen_encoder_mapping is allowed only if weights are frozen and versioned.
    - learned_mapping is forbidden for stage-2 benchmark runs.

registry_link:
  input_registry_version: 2.0
  input_registry_file: configs/input_registry.yaml

experiments:
  - reproducibility
  - sensitivity
  - separability
  - family_deformation

generators:
  nonlinear:
    - julia_orbit_trap
    - orbit_ifs_multi_trap
    - duffing_lyapunov
    - chaotic_scattering
  baselines:
    - random_baseline
    - smooth_geometric_baseline
    - single_parameter_map_baseline

modes:
  research-fast:
    resolution_default: [96, 96]
    resolution_duffing: [64, 64]
    resolution_scattering: [64, 64]
    repeats_per_class: 3
    sensitivity_steps: 21
    deformation_steps: 10
    duffing_steps: 240
    ifs_points: 15000
  research:
    resolution_default: [160, 160]
    resolution_duffing: [128, 128]
    resolution_scattering: [128, 128]
    repeats_per_class: 5
    sensitivity_steps: 21
    deformation_steps: 8
    duffing_steps: 400
    ifs_points: 50000
  publication:
    resolution_default: [192, 192]
    resolution_duffing: [192, 192]
    resolution_scattering: [192, 192]
    repeats_per_class: 7
    sensitivity_steps: 25
    deformation_steps: 10
    duffing_steps: 600
    ifs_points: 80000
  validation-hires:
    resolution_default: [384, 384]
    resolution_duffing: [384, 384]
    resolution_scattering: [384, 384]
    repeats_per_class: 5
    sensitivity_steps: 31
    deformation_steps: 12
    duffing_steps: 600
    ifs_points: 100000

runtime:
  active_mode: research-fast
  n_workers: 6
  skip_completed: true
  resume_supported: true
  fail_fast: false
  save_observation_arrays: false
  save_preview_png: true

randomness:
  seeds: [0, 1, 2, 3, 4]
  seed_strategy: explicit_list

noise_levels: [0.0, 0.01, 0.03, 0.05]

noise:
  seed_noise:
    julia_orbit_trap: 0.0
    orbit_ifs_multi_trap: 0.01
    duffing_lyapunov: 0.0
    chaotic_scattering: 0.0
    random_baseline: 0.03
    smooth_geometric_baseline: 0.0
    single_parameter_map_baseline: 0.0
  parameter_noise:
    source: noise_levels
    levels: [0.0, 0.01, 0.03, 0.05]
    default_scale: 0.01
    semantics: >-
      Runner noise_level values must be taken directly from this list.
  deformation_amplitude:
    julia_orbit_trap: 0.25
    orbit_ifs_multi_trap: 0.25
    duffing_lyapunov: 0.80        # <-- Сильная раскачка для Дуффинга!
    chaotic_scattering: 0.25
    default: 0.25
  observer_noise:
    enabled: false
    scale: 0.0

feature_handling:
  common_features:
    - symmetry_score
    - fractal_dim_proxy
    - basin_entropy
    - density_variation
  generator_specific_features:
    duffing_lyapunov:
      - lyapunov_mean
      - lyapunov_std
      - stability_gradient
    chaotic_scattering:
      - escape_time_mean
      - escape_time_std
      - basin_count
    orbit_ifs_multi_trap:
      - orbit_occupancy
      - trap_interaction_score
      - support_area
    julia_orbit_trap:
      - escape_ratio
      - trap_response_mean
      - connected_component_proxy
  feature_normalization: robust_zscore_per_feature
  store_raw_features: true
  store_normalized_features: true

metrics:
  required:
    - mean_cv
    - max_cv
    - within_mean
    - between_mean
    - separability
    - cohesion_ratio
    - basin_entropy
    - symmetry_score
    - fractal_dim_proxy
    - n_bifurcations
    - seed_sensitivity
    - input_perturbation_sensitivity
    - observer_variance
    - silhouette_like_score
    - top1_class_retrieval
    - top3_class_retrieval
    - stability_diversity_ratio
    - family_continuity_score
  ranking:
    primary_sort: median
    secondary_sort: lower_ci_bound
    instability_flag:
      cv_threshold: 0.5
      iqr_threshold: 1.0

bifurcation_detection:
  smoothing_window: 2      
  z_threshold: 1.5         
  persistence_points: 1    
  min_jump_norm: 0.05      

factorial_design:
  axes:
    - generator
    - experiment
    - class_name
    - instance_id
    - seed
    - noise_level
    - deformation_step
    - mapping_mode
  run_id_template: '{generator}__{experiment}__{class_name}__i{instance_id}__s{seed}__n{noise_level}__d{deformation_step}__{mapping_mode}'
  required_run_fields:
    - run_id
    - generator
    - experiment
    - class_name
    - instance_id
    - seed
    - noise_level
    - deformation_step
    - mapping_mode
    - status

artifacts:
  required_files:
    - run_table.csv
    - features_raw.parquet
    - features_normalized.parquet
    - aggregate_by_class.csv
    - aggregate_by_generator.csv
    - aggregate_by_experiment.csv
    - pairwise_distance_matrix.csv
    - retrieval_accuracy.csv
    - bifurcation_events.csv
    - summary.json
    - research_report.md
    - manifest_full.json

statistics:
  summary_statistics:
    - mean
    - std
    - median
    - iqr
    - min
    - max
    - n
  bootstrap:
    enabled: true
    n_resamples: 1000
    confidence_level: 0.95

stage2_decision:
  criteria:
    - separability statistically above baseline
    - within_mean below configured threshold
    - family_continuity_score above minimum threshold
    - stable under validation-hires mode
    - not dominated by one seed or one class
  thresholds:
    within_mean_max: 1.0
    family_continuity_score_min: 0.3
  output_block_required: true