schema_version: palettes/v0.3
palette_library_version: 0.3.2

global_rules:
  color_space: sRGB
  internal_alpha_range: [0.0, 1.0]
  max_accents_per_plan: 1
  allow_layer_palette_override: true
  fallback_palette_id: neutral_noir

palettes:

  neutral_noir:
    family: neutral
    background_rgba: [7, 9, 18, 255]
    dominant_stops:
      - { position: 0.00, color: "#070912" }
      - { position: 0.45, color: "#3A4555" }
      - { position: 1.00, color: "#E4E7E8" }
    accent_color: "#FFFFFF"
    saturation_budget: 0.25
    contrast: 1.00
    luminance_gamma: 1.00

  nocturne_amber:
    family: blue_amber
    background_rgba: [7, 9, 18, 255]
    dominant_stops:
      - { position: 0.00, color: "#06111D" }
      - { position: 0.38, color: "#0D4B63" }
      - { position: 0.70, color: "#278590" }
      - { position: 1.00, color: "#E8AF48" }
    accent_color: "#FFD07A"
    saturation_budget: 0.70
    contrast: 1.10
    luminance_gamma: 0.94

  lunar_mist:
    family: lunar
    background_rgba: [9, 16, 26, 255]
    dominant_stops:
      - { position: 0.00, color: "#081521" }
      - { position: 0.50, color: "#466C86" }
      - { position: 1.00, color: "#D3E6E8" }
    accent_color: "#B7F0F4"
    saturation_budget: 0.35
    contrast: 0.94
    luminance_gamma: 1.08

  spectral_neon:
    family: neon
    background_rgba: [5, 4, 18, 255]
    dominant_stops:
      - { position: 0.00, color: "#07172B" }
      - { position: 0.42, color: "#00BEEA" }
      - { position: 0.72, color: "#8050F0" }
      - { position: 1.00, color: "#F83F9C" }
    accent_color: "#D9FFFF"
    saturation_budget: 0.92
    contrast: 1.24
    luminance_gamma: 0.88

  crimson_gold_noir:
    family: cinematic
    background_rgba: [10, 5, 8, 255]
    dominant_stops:
      - { position: 0.00, color: "#0A0508" }
      - { position: 0.45, color: "#46151D" }
      - { position: 0.76, color: "#AE3731" }
      - { position: 1.00, color: "#D5A548" }
    accent_color: "#FFE0A3"
    saturation_budget: 0.74
    contrast: 1.22
    luminance_gamma: 0.92

  charcoal_red_white:
    family: raw_contrast
    background_rgba: [11, 11, 12, 255]
    dominant_stops:
      - { position: 0.00, color: "#111114" }
      - { position: 0.45, color: "#49494C" }
      - { position: 0.72, color: "#B81924" }
      - { position: 1.00, color: "#EFEDE5" }
    accent_color: "#FFFFFF"
    saturation_budget: 0.68
    contrast: 1.30
    luminance_gamma: 0.90

  pale_gold_accent:
    family: accent
    background_rgba: [0, 0, 0, 0]
    dominant_stops:
      - { position: 0.00, color: "#433112" }
      - { position: 1.00, color: "#FFE5A0" }
    accent_color: "#FFF5D2"
    saturation_budget: 0.45
    contrast: 1.05
    luminance_gamma: 1.00

  # B1: новая полноценная палитра для classical профиля
  # Тёмная основа + кобальтовый корпус + слоновая кость + золотой акцент
  ivory_cobalt:
    family: classical
    background_rgba: [20, 23, 27, 255]
    dominant_stops:
      - { position: 0.00, color: "#111820" }
      - { position: 0.42, color: "#314F78" }
      - { position: 0.76, color: "#B8C9D7" }
      - { position: 1.00, color: "#F0E8D8" }
    accent_color: "#C89B43"
    saturation_budget: 0.42
    contrast: 1.08
    luminance_gamma: 0.98

  # E3-C: новые палитры для недостающих style-профилей

  # Для blues_jazz: тёплый тёмный фон, янтарно-золотой gradient, телесный акцент
  warm_midnight:
    family: warm_dark
    background_rgba: [14, 9, 5, 255]
    dominant_stops:
      - { position: 0.00, color: "#0E0905" }
      - { position: 0.35, color: "#3D2210" }
      - { position: 0.68, color: "#8B4F1A" }
      - { position: 1.00, color: "#D4923A" }
    accent_color: "#F5C97A"
    saturation_budget: 0.62
    contrast: 1.12
    luminance_gamma: 0.96

  # Для rock / тяжёлых стилей: насыщенный тёмный фон, пурпурно-красный корпус
  dark_saturated:
    family: rock_dark
    background_rgba: [8, 6, 10, 255]
    dominant_stops:
      - { position: 0.00, color: "#08060A" }
      - { position: 0.38, color: "#2E1035" }
      - { position: 0.68, color: "#7A1E3C" }
      - { position: 1.00, color: "#C43050" }
    accent_color: "#FF7090"
    saturation_budget: 0.80
    contrast: 1.28
    luminance_gamma: 0.90

  # Для pop / jazz (светлый): живая светлая база, бирюзово-оранжевый контраст
  vivid_light:
    family: pop_light
    background_rgba: [248, 246, 240, 255]
    dominant_stops:
      - { position: 0.00, color: "#F8F6F0" }
      - { position: 0.40, color: "#5BC8C0" }
      - { position: 0.72, color: "#F07030" }
      - { position: 1.00, color: "#1A1A2E" }
    accent_color: "#FF5520"
    saturation_budget: 0.78
    contrast: 1.18
    luminance_gamma: 1.04

  # Для electronic / neon стилей: ультра-насыщенный неон на почти-чёрном фоне
  neon_dark:
    family: neon_dark
    background_rgba: [4, 3, 12, 255]
    dominant_stops:
      - { position: 0.00, color: "#04030C" }
      - { position: 0.30, color: "#0A0F30" }
      - { position: 0.58, color: "#00E5B0" }
      - { position: 0.82, color: "#7B00FF" }
      - { position: 1.00, color: "#FF2D78" }
    accent_color: "#00FFCC"
    saturation_budget: 0.96
    contrast: 1.35
    luminance_gamma: 0.85
