# Default interpretation profile
# Fixes: unknown_interpretation_profile: 'default' (12 FAILED in test12)
# This is the neutral/fallback profile used when no specific
# interpretation profile is requested.
slug: default
display_name: Default
description: >-
  Neutral interpretation profile. Applies linear passthrough of perceptual
  axes with no genre-specific biases. Suitable for smoke tests, unit tests,
  and as a fallback when no domain profile is specified.

mapping_rules:
  symmetry_bias:
    base: 0.5
    formula: "base + (stability - 0.5) * 0.3"

  recursion_depth:
    base: 0.5
    formula: "base + (section_complexity - 0.5) * 0.4"

  density_level:
    base: 0.5
    formula: "base + (density - 0.5) * 0.5"

  noise_level:
    base: 0.25
    formula: "base + noise_proxy * 0.5"

  motion_intensity:
    base: 0.5
    formula: "base + (energy - 0.5) * 0.5"

  texture_complexity:
    base: 0.5
    formula: "base + morphology_guard * 0.3 + (section_complexity - 0.5) * 0.2"

  layout_macro_shape:
    rules:
      - when: "macro_shape_hint == 'surge'"
        value: "climax_arch"
      - when: "macro_shape_hint == 'drift'"
        value: "fade_envelope"
      - when: "macro_shape_hint == 'loop'"
        value: "ABA_like"
      - when: "macro_shape_hint == 'meander'"
        value: "through_composed"
      - when: "macro_shape_hint == 'drive'"
        value: "progressive_build"
      - when: "macro_shape_hint == 'arch'"
        value: "arch_form"
      - when: "macro_shape_hint == 'pulse'"
        value: "ostinato"
      - when: "True"
        value: "ABA_like"

guardrails:
  - when: "noise_proxy > 0.85"
    actions:
      noise_level:
        min: 0.6
      texture_complexity:
        max: 0.9

  - when: "tension > 0.85 and stability < 0.2"
    actions:
      symmetry_bias:
        max: 0.5
      motion_intensity:
        min: 0.6

  - when: "morphology_guard > 0.7"
    actions:
      texture_complexity:
        min: 0.55
      recursion_depth:
        min: 0.5
