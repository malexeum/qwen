schema_version: visual-composition-profile/v0.3
# E3: theta-driven profiles v0.4.0
# — harmony_theta_0..7 подключены как mapping sources во всех 7 профилях
# — добавлен профиль pop
# — soundtrack переименован в rock (визуально неверный, заменён полноценным rock)
# — profile_library_version: 0.4.0, theta_mapping_version: 1.0
profile_library_version: "0.4.0"
theta_mapping_version: "1.0"

imports:
  generator_catalog: generator_catalog.yaml
  palettes: palettes.yaml
  postprocess_styles: poster_styles.yaml

global_rules:
  canvas:
    width_px: 1024
    height_px: 1024
    mode: preview
    color_space: sRGB

  layer_limits:
    minimum_enabled_layers: 3
    maximum_enabled_layers: 5

  coordinate_system:
    unit: normalized_canvas
    origin: center
    x_range: [-1.0, 1.0]
    y_range: [-1.0, 1.0]
    angle_unit: deg

  blend_modes:
    allowed:
      - normal
      - screen
      - add
      - multiply
      - soft_light
      - max

  python_policy:
    output_size_fixed: [1024, 1024]
    allow_final_export: false
    allow_user_presets: false

  seed_policy:
    algorithm: sha256
    base_components:
      - audio_content_hash
      - canonical_title
      - canonical_artist
      - duration_ms
      - style_profile_slug
      - profile_library_version
      - harmony_theta_hash
    layer_components:
      - base_seed
      - layer_id
      - canonical_generator_id
      - variation_seed

  validation:
    unknown_mapping_target: error
    unsupported_source_axis: error
    unresolved_alias: error
    missing_required_audio_feature: error
    inactive_parameter_policy: explicit_na_required
    unknown_theta_source: error

defaults:
  visual_identity:
    palette_id: neutral_noir
    macro_archetype: quiet_field
    postprocess_style_slug: fullcolor

  composition:
    background_opacity: 1.0
    negative_space:
      enabled: true
      minimum_coverage: 0.08
      maximum_coverage: 0.58

  transforms:
    center:
      offset_norm: [0.0, 0.0]
      scale_xy: [1.0, 1.0]
      rotation_deg: 0.0

profiles:

  # ─────────────────────────────────────────────────────────
  # blues_jazz — тёплая несовершенная гармония, живая текстура
  # θ₃→duffing.forcing  θ₂→ifs.map_diversity  θ₅→noise.amplitude  θ₇→snowflake.branch_depth
  # ─────────────────────────────────────────────────────────
  blues_jazz:
    description: >
      Ночной органический контрапункт: орбитальные дуги как главная сцена,
      julia-свечение поверх как глубина, duffing-хаос внутри формы (тонко),
      тёплый редкий акцент, активная пустота.

    identity:
      palette_id: nocturne_amber
      macro_archetype: orbital_flow
      postprocess_style_slug: grainfilm
      visual_keywords:
        - organic
        - improvisational
        - nocturnal
        - warm

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.14, 0.42]
        direction_source: layout_macro_shape

    layers:
      - id: orbital_arcs
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.80
        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity
        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity
          angular_break: harmony_theta_6

      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.14
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.56
        mapping:
          forcing: harmony_theta_3
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: harmony_theta_2
          n_steps: recursion_depth
          stochastic_scale: harmony_theta_5
          gamma_window: density_level
          omega_window: density_level

      - id: julia_glow
        role: fractal_body
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 20
        opacity: 0.45
        blend_mode: screen
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.72
        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity
        mapping:
          c_real: harmony_theta_0
          c_imag: harmony_theta_3
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          stochastic_scale: noise_level

      - id: grain_field
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 1.00
        mapping:
          amplitude: harmony_theta_5
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      - id: crystalline_accent
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: section_complexity
              operator: gte
              value: 0.56
            - source: harmonic_stability
              operator: gte
              value: 0.38
        z_index: 40
        opacity: 0.28
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.50
        transform:
          anchor_from: track_identity_seed
          scale_range: [0.18, 0.38]
          scale_source: texture_complexity
          rotation_range_deg: [0.0, 360.0]
          rotation_source: harmonic_change_rate
        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_7
          branch_jitter: noise_level
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00
        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────────────────
  # ambient — пространство, плавность, контролируемая неопределённость
  # θ₀→julia.c_real  θ₃→duffing.forcing  θ₂→ifs density  θ₆→orbital.angular_break
  # ─────────────────────────────────────────────────────────
  ambient:
    description: >
      Холодное медленное поле: разреженный julia как дрейфующий туман,
      duffing-хаос тонким подслоем, фрактальная граница через scattering,
      едва заметный orbital breath и большая пауза.

    identity:
      palette_id: lunar_mist
      macro_archetype: quiet_field
      postprocess_style_slug: fullcolor
      visual_keywords:
        - spacious
        - cold
        - submerged
        - slow

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.28, 0.58]
        direction_source: layout_macro_shape

    layers:
      - id: macro_field
        role: macro_structure
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 10
        opacity: 0.76
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72
        transform:
          offset_from: layout_macro_shape
          scale_range: [0.60, 1.08]
          scale_source: density_level
          rotation_range_deg: [-12.0, 12.0]
          rotation_source: motion_intensity
        mapping:
          c_real: harmony_theta_0
          c_imag: harmony_theta_3
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          domain_zoom: motion_intensity
          stochastic_scale: noise_level

      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.10
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 0.50
        mapping:
          forcing: harmony_theta_3
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: harmony_theta_5
          gamma_window: density_level
          omega_window: density_level

      - id: orbital_breath
        role: meso_rhythm
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.24
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.60
        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity
          angular_break: harmony_theta_6

      - id: edge_distortion
        role: edge_distortion
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 25
        opacity: 0.18
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.48
        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: harmony_theta_2
          initial_velocity_x: energy
          initial_velocity_y: motion_intensity
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: mist
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.08
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00
        mapping:
          amplitude: harmony_theta_5
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: texture_complexity

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 40
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00
        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────────────────
  # jazz — активная гармония и контрапункт без визуального хаоса
  # θ₁→orbital.flow_speed  θ₂→ifs.map_diversity  θ₃→duffing.forcing  θ₇→snowflake symmetry
  # ─────────────────────────────────────────────────────────
  jazz:
    description: >
      Свободная импровизационная динамика: бассейны притяжения с хаотическими
      траекториями, лунная мгла, микрозерно и усиленный гармонический орнамент.

    identity:
      palette_id: lunar_mist
      macro_archetype: scattering_improvisation
      postprocess_style_slug: fullcolor
      visual_keywords:
        - improvisational
        - fluid
        - fragmented
        - lunar

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.18, 0.46]
        direction_source: layout_macro_shape

    layers:
      - id: scatter_base
        role: macro_structure
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72
        transform:
          offset_from: layout_macro_shape
          scale_range: [0.70, 1.10]
          scale_source: energy
          rotation_range_deg: [-20.0, 20.0]
          rotation_source: motion_intensity
        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: texture_complexity
          initial_velocity_x: energy
          initial_velocity_y: harmony_theta_3
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: orbital_counterpoint
        role: counterpoint
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.26
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.56
        mapping:
          flow_speed: harmony_theta_1
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity
          angular_break: harmony_theta_6

      - id: jazz_ifs
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 25
        opacity: 0.32
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.56
        mapping:
          n_points: density_level
          map_diversity: harmony_theta_2
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      - id: jazz_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00
        mapping:
          amplitude: harmony_theta_5
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      - id: harmonic_ornament
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.42
        z_index: 40
        opacity: 0.22
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.48
        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_7
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00
        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────────────────
  # classical — иерархия, ясный центр, сдержанный контраст
  # θ₇→snowflake.branch_depth  θ₄→ifs macro contrast  θ₃→duffing(лимит 0.35)  θ₅ не доминирует
  # ─────────────────────────────────────────────────────────
  classical:
    description: >
      Симметричная архитектурная композиция: строгие концентрические рельсы,
      duffing-хаос multiply внутри (ломает монолит, не разрушает структуру),
      фрактальная решётка, видимый гармонический орнамент.

    identity:
      palette_id: ivory_cobalt
      macro_archetype: architectural_symmetry
      postprocess_style_slug: fullcolor
      visual_keywords:
        - structured
        - harmonic
        - architectural
        - luminous

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.20, 0.50]
        direction_source: layout_macro_shape

    layers:
      - id: orbital_rails
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.78
        blend_mode: normal
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.80
        transform:
          offset_from: layout_macro_shape
          scale_range: [0.72, 1.12]
          scale_source: energy
          rotation_range_deg: [0.0, 0.0]
          rotation_source: motion_intensity
        mapping:
          flow_speed: tempo
          orbit_radius: harmonic_stability
          line_count: symmetry_bias
          amplitude: energy
          rotation_deg: motion_intensity

      # θ₃ используется с жёстким верхним лимитом 0.35 — classical не должен разрушаться хаосом
      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.12
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.56
        mapping:
          forcing: harmony_theta_3
          forcing_limit: 0.35
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: fractal_grid
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 20
        opacity: 0.52
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.64
        mapping:
          n_points: density_level
          map_diversity: harmony_theta_4
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      - id: architectural_symmetry
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.60
            - source: section_complexity
              operator: gte
              value: 0.48
        z_index: 30
        opacity: 0.35
        blend_mode: screen
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.50
        transform:
          anchor_from: track_identity_seed
          scale