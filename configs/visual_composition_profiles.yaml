        opacity: 0.78
        blend_mode: normal
        palette_id: neutral_noir
        computation_resolution_fraction: 0.80
        rotation_range_deg: [-10.0, 10.0]
        mapping:
          tempo: tempo
          repetition_bias: repetition
          point_density: density_level
          energy_scale: energy
          flow_intensity: motion_intensity
