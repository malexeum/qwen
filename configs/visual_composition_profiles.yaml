schema_version: visual-composition-profile/v0.4
# E3: theta-driven profiles v0.4.0
# harmony_theta_0..7 подключены как mapping sources во всех 7 профилях
# Новый профиль: pop
# profile_library_version: 0.4.0
# theta_mapping_version: 1.0
profile_library_version: "0.4.0"
theta_mapping_version: "1.0"

imports:
  generator_catalog: generator_catalog.yaml
  palettes: palettes.yaml
  postprocess_styles: poster_styles.yaml

global_rules:
  canvas:
    width_px: 1024
    height_px: 1024
    mode: preview
    color_space: sRGB

  layer_limits:
    minimum_enabled_layers: 3
    maximum_enabled_layers: 5

  coordinate_system:
    unit: normalized_canvas
    origin: center
    x_range: [-1.0, 1.0]
    y_range: [-1.0, 1.0]
    angle_unit: deg

  blend_modes:
    allowed:
      - normal
      - screen
      - add
      - multiply
      - soft_light
      - max

  python_policy:
    output_size_fixed: [1024, 1024]
    allow_final_export: false
    allow_user_presets: false

  seed_policy:
    algorithm: sha256
    base_components:
      - audio_content_hash
      - canonical_title
      - canonical_artist
      - duration_ms
      - style_profile_slug
      - profile_library_version
      - harmony_theta_hash
    layer_components:
      - base_seed
      - layer_id
      - canonical_generator_id
      - variation_seed

  validation:
    unknown_mapping_target: error
    unsupported_source_axis: error
    unresolved_alias: error
    missing_required_audio_feature: error
    inactive_parameter_policy: explicit_na_required

defaults:
  visual_identity:
    palette_id: neutral_noir
    macro_archetype: quiet_field
    postprocess_style_slug: fullcolor

  composition:
    background_opacity: 1.0
    negative_space:
      enabled: true
      minimum_coverage: 0.08
      maximum_coverage: 0.58

  transforms:
    center:
      offset_norm: [0.0, 0.0]
      scale_xy: [1.0, 1.0]
      rotation_deg: 0.0

profiles:

  # ─────────────────────────────────────────────
  # blues_jazz
  # θ₃ → duffing.forcing  θ₂ → ifs.map_diversity
  # θ₅ → noise.amplitude  θ₇ → snowflake.branch_depth
  # ─────────────────────────────────────────────
  blues_jazz:
    description: >
      Ночной органический контрапункт: орбитальные дуги как главная сцена,
      julia-свечение поверх как глубина, duffing-хаос внутри формы (тонко),
      тёплый редкий акцент, активная пустота.
      θ₃ усиливает Duffing forcing под настроение; θ₅ — живая зернистость.

    identity:
      palette_id: nocturne_amber
      macro_archetype: orbital_flow
      postprocess_style_slug: grainfilm
      visual_keywords:
        - organic
        - improvisational
        - nocturnal
        - warm

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.14, 0.42]
        direction_source: layout_macro_shape

    layers:
      - id: orbital_arcs
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.80

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity

        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity
          angular_break: harmony_theta_6   # θ₆: энтропия развития → ломаные дуги

      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.14
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.56

        mapping:
          forcing: harmony_theta_3         # θ₃: неразрешённое напряжение → Duffing forcing
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: julia_glow
        role: fractal_body
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 20
        opacity: 0.45
        blend_mode: screen
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity

        mapping:
          c_real: symmetry_bias
          c_imag: harmony_theta_3          # θ₃: напряжение в комплексном параметре Julia
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          stochastic_scale: noise_level

      - id: grain_field
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: harmony_theta_5       # θ₅: тембральный хаос → зернистость
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      - id: crystalline_accent
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: section_complexity
              operator: gte
              value: 0.56
            - source: harmonic_stability
              operator: gte
              value: 0.38
        z_index: 40
        opacity: 0.28
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.50

        transform:
          anchor_from: track_identity_seed
          scale_range: [0.18, 0.38]
          scale_source: texture_complexity
          rotation_range_deg: [0.0, 360.0]
          rotation_source: harmonic_change_rate

        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_7    # θ₇: кристалличность → глубина снежинки
          branch_jitter: noise_level
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────
  # ambient
  # θ₀ → julia.c_real   θ₃ → julia.c_imag / duffing.forcing
  # θ₂ → IFS density    θ₆ → orbital.angular_break
  # ─────────────────────────────────────────────
  ambient:
    description: >
      Холодное медленное поле: разреженный julia как дрейфующий туман,
      duffing-хаос тонким подслоем, фрактальная граница через scattering,
      едва заметный orbital breath и большая пауза.
      θ₀ задаёт форму Julia центра; θ₃ — смещение туманности.

    identity:
      palette_id: lunar_mist
      macro_archetype: quiet_field
      postprocess_style_slug: fullcolor
      visual_keywords:
        - spacious
        - cold
        - submerged
        - slow

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.28, 0.58]
        direction_source: layout_macro_shape

    layers:
      - id: macro_field
        role: macro_structure
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 10
        opacity: 0.76
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.60, 1.08]
          scale_source: density_level
          rotation_range_deg: [-12.0, 12.0]
          rotation_source: motion_intensity

        mapping:
          c_real: harmony_theta_0           # θ₀: гармоническая чистота → форма Julia
          c_imag: harmony_theta_3           # θ₃: напряжение → смещение центра
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          domain_zoom: motion_intensity
          stochastic_scale: noise_level

      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.10
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 0.50

        mapping:
          forcing: harmony_theta_3          # θ₃: напряжение → хаотический подслой
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: orbital_breath
        role: meso_rhythm
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.24
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.60

        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity
          angular_break: harmony_theta_6    # θ₆: энтропия → лёгкий излом орбит

      - id: edge_distortion
        role: edge_distortion
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 25
        opacity: 0.18
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.48

        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: harmony_theta_2    # θ₂: структурная плотность → радиус рассеивателей
          initial_velocity_x: energy
          initial_velocity_y: motion_intensity
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: mist
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.08
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: harmony_theta_5        # θ₅: тембральный хаос → туманность
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: texture_complexity

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 40
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────
  # jazz
  # θ₁ → orbital.flow_speed  θ₂ → IFS.map_diversity
  # θ₃ → Duffing.forcing      θ₇ → snowflake.branch_depth
  # ─────────────────────────────────────────────
  jazz:
    description: >
      Свободная импровизационная динамика: бассейны притяжения с хаотическими
      траекториями, лунная мгла, микрозерно и усиленный гармонический орнамент.
      θ₁ контролирует темп орбит; θ₃ — хаотическое напряжение Duffing.

    identity:
      palette_id: lunar_mist
      macro_archetype: scattering_improvisation
      postprocess_style_slug: fullcolor
      visual_keywords:
        - improvisational
        - fluid
        - fragmented
        - lunar

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.18, 0.46]
        direction_source: layout_macro_shape

    layers:
      - id: scatter_base
        role: macro_structure
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.70, 1.10]
          scale_source: energy
          rotation_range_deg: [-20.0, 20.0]
          rotation_source: motion_intensity

        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: harmony_theta_2    # θ₂: структурная плотность → центр рассеивания
          initial_velocity_x: energy
          initial_velocity_y: harmony_theta_3  # θ₃: напряжение → начальная скорость Y
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: orbital_counterpoint
        role: counterpoint
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.26
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.56

        mapping:
          flow_speed: harmony_theta_1       # θ₁: стабильность × смена гармоний → скорость орбит
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity

      - id: jazz_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: harmony_theta_5        # θ₅: тембральный хаос → зерно
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      - id: harmonic_ornament
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.42
        z_index: 40
        opacity: 0.22
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.48

        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_7     # θ₇: кристалличность → глубина орнамента
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────
  # classical
  # θ₇ → julia.exponent_p / snowflake.branch_depth
  # θ₄ → IFS macro contrast   θ₃ → Duffing (limited)
  # ─────────────────────────────────────────────
  classical:
    description: >
      Симметричная архитектурная композиция: строгие концентрические рельсы,
      duffing-хаос multiply внутри (ломает монолит, не разрушает структуру),
      фрактальная решётка, видимый гармонический орнамент, кобальтово-слоновая палитра.
      θ₇ управляет кристалличностью; θ₃ зажат лимитом чтобы не сломать строй.

    identity:
      palette_id: ivory_cobalt
      macro_archetype: architectural_symmetry
      postprocess_style_slug: fullcolor
      visual_keywords:
        - structured
        - harmonic
        - architectural
        - luminous

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.20, 0.50]
        direction_source: layout_macro_shape

    layers:
      - id: orbital_rails
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.78
        blend_mode: normal
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.80

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.72, 1.12]
          scale_source: energy
          rotation_range_deg: [0.0, 0.0]
          rotation_source: motion_intensity

        mapping:
          flow_speed: tempo
          orbit_radius: harmonic_stability
          line_count: symmetry_bias
          amplitude: energy
          rotation_deg: motion_intensity
          # θ₆ минимален для classical — только чтобы убрать монотонность
          angular_break: harmony_theta_6

      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.12
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.56

        mapping:
          # θ₃ зажат: classical не должен превращаться в хаос
          # forcing ограничен профилем до 0.40 максимум через guardrail в engine
          forcing: harmony_theta_3
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: fractal_grid
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 20
        opacity: 0.52
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.64

        mapping:
          n_points: density_level
          map_diversity: harmony_theta_4    # θ₄: чистый контраст секций → разнообразие карт
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      - id: architectural_symmetry
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.60
            - source: section_complexity
              operator: gte
              value: 0.48
        z_index: 30
        opacity: 0.35
        blend_mode: screen
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.50

        transform:
          anchor_from: track_identity_seed
          scale_range: [0.14, 0.36]
          scale_source: texture_complexity
          rotation_range_deg: [0.0, 360.0]
          rotation_source: harmonic_change_rate

        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_7     # θ₇: кристалличность → глубина
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: classical_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 40
        opacity: 0.07
        blend_mode: soft_light
        palette_id: ivory_cobalt
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level            # θ₅ не dominant для classical — шум должен быть скромен
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: texture_complexity

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────
  # electronic
  # θ₂ → IFS density   θ₃ → scattering velocity
  # θ₅ → noise amp     θ₆ → orbital flow
  # ─────────────────────────────────────────────
  electronic:
    description: >
      Электрическая бифуркация: поле нелинейного напряжения,
      плотные ритмические скопления, спектральное зерно и кристаллические импульсы.
      θ₂ задаёт IFS плотность; θ₅ — тембральный хаос синтеза.

    identity:
      palette_id: spectral_neon
      macro_archetype: bifurcation_impulse
      postprocess_style_slug: grainfilm
      visual_keywords:
        - electric
        - kinetic
        - unstable
        - synthetic

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.08, 0.28]
        direction_source: layout_macro_shape

    layers:
      - id: tension_field
        role: macro_structure
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 10
        opacity: 0.86
        blend_mode: normal
        palette_id: spectral_neon
        computation_resolution_fraction: 0.75

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.80, 1.20]
          scale_source: energy
          rotation_range_deg: [-30.0, 30.0]
          rotation_source: motion_intensity

        mapping:
          forcing: harmony_theta_3          # θ₃: напряжение → Duffing forcing
          damping: tension
          forcing_frequency: harmony_theta_6 # θ₆: энтропия развития → частота
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: pulse_density
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 20
        opacity: 0.48
        blend_mode: screen
        palette_id: spectral_neon
        computation_resolution_fraction: 0.64

        mapping:
          n_points: density_level
          map_diversity: harmony_theta_2    # θ₂: структурная плотность → IFS diversity
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      - id: spectral_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.12
        blend_mode: add
        palette_id: spectral_neon
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: harmony_theta_5        # θ₅: тембральный хаос → плотность зерна
          frequency_scale: spectral_flatness
          color_variation: tension
          grain_size: texture_complexity

      - id: crystal_pulse
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          any:
            - source: energy
              operator: gte
              value: 0.54
            - source: section_complexity
              operator: gte
              value: 0.62
        z_index: 40
        opacity: 0.13
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.38

        mapping:
          branch_count: symmetry_bias
          branch_depth: harmony_theta_4     # θ₄: контраст секций → глубина
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # ─────────────────────────────────────────────
  # rock
  # θ₃ → duffing.forcing  θ₆ → scattering velocity
  # θ₂ → IFS.map_diversity θ₅ → noise.amplitude
  # ─────────────────────────────────────────────
  rock:
    description: >
      Физическая, рваная композиция: бассейны-конфликты, плотное тело IFS,
      ломаные траектории и абразивная поверхность.
      θ₃ — импульс нелинейного удара; θ₆ — направленность хаотических траекторий.

    identity:
      palette_id: charcoal_red_white
      macro_archetype: fractured_drive
      postprocess_style_slug: grainfilm
      visual_keywords:
        - raw
        - loud
        - fractured
        - physical

    composition:
