schema_version: visual-composition-profile/v0.3
# B2: структурная дифференциация blues_jazz и classical
# blues_jazz: orbital_field → главная сцена, julia → свечение поверх
# classical: orbital_field (rotation=0) → строгие рельсы, ifs multiply → решётка,
#            symmetry_snowflake opacity 0.35 → видимая симметрия
# 5 профилей: 5 разных macro_structure генераторов
# V1: duffing_lyapunov добавлен как chaos_underbody (soft_light/multiply, opacity 0.10–0.14)
#     в blues_jazz, ambient, classical — тонкий хаос внутри основной формы
#     ambient: добавлен chaotic_scattering_basins как edge_distortion (фрактальная граница)
#     blues_jazz/jazz: snowflake opacity поднята до видимого уровня
profile_library_version: 0.3.4

imports:
  generator_catalog: generator_catalog.yaml
  palettes: palettes.yaml
  postprocess_styles: poster_styles.yaml

global_rules:
  canvas:
    width_px: 1024
    height_px: 1024
    mode: preview
    color_space: sRGB

  layer_limits:
    minimum_enabled_layers: 3
    maximum_enabled_layers: 5

  coordinate_system:
    unit: normalized_canvas
    origin: center
    x_range: [-1.0, 1.0]
    y_range: [-1.0, 1.0]
    angle_unit: deg

  blend_modes:
    allowed:
      - normal
      - screen
      - add
      - multiply
      - soft_light
      - max

  python_policy:
    output_size_fixed: [1024, 1024]
    allow_final_export: false
    allow_user_presets: false

  seed_policy:
    algorithm: sha256
    base_components:
      - audio_content_hash
      - canonical_title
      - canonical_artist
      - duration_ms
      - style_profile_slug
      - profile_library_version
    layer_components:
      - base_seed
      - layer_id
      - canonical_generator_id
      - variation_seed

  validation:
    unknown_mapping_target: error
    unsupported_source_axis: error
    unresolved_alias: error
    missing_required_audio_feature: error
    inactive_parameter_policy: explicit_na_required

defaults:
  visual_identity:
    palette_id: neutral_noir
    macro_archetype: quiet_field
    postprocess_style_slug: fullcolor

  composition:
    background_opacity: 1.0
    negative_space:
      enabled: true
      minimum_coverage: 0.08
      maximum_coverage: 0.58

  transforms:
    center:
      offset_norm: [0.0, 0.0]
      scale_xy: [1.0, 1.0]
      rotation_deg: 0.0

profiles:

  # blues_jazz — orbital_field главная сцена, julia свечение, duffing подслой хаоса
  blues_jazz:
    description: >
      Ночной органический контрапункт: орбитальные дуги как главная сцена,
      julia-свечение поверх как глубина, duffing-хаос внутри формы (тонко),
      тёплый редкий акцент, активная пустота.

    identity:
      palette_id: nocturne_amber
      macro_archetype: orbital_flow
      postprocess_style_slug: grainfilm
      visual_keywords:
        - organic
        - improvisational
        - nocturnal
        - warm

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.14, 0.42]
        direction_source: layout_macro_shape

    layers:
      # z10: orbital_field — главная сцена, органические дуги
      - id: orbital_arcs
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.80

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity

        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity

      # z15: duffing_lyapunov — тонкий хаотический подслой внутри формы
      # soft_light не разрушает цвет, добавляет фактуру и глубину
      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.14
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.56

        mapping:
          forcing: energy
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      # z20: julia_orbit_trap — свечение и глубина поверх дуг
      - id: julia_glow
        role: fractal_body
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 20
        opacity: 0.45
        blend_mode: screen
        palette_id: nocturne_amber
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.74, 1.16]
          scale_source: energy
          rotation_range_deg: [-24.0, 24.0]
          rotation_source: motion_intensity

        mapping:
          c_real: symmetry_bias
          c_imag: tension
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          stochastic_scale: noise_level

      - id: grain_field
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: nocturne_amber
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      # z40: snowflake — поднята opacity 0.11→0.28, теперь видима
      - id: crystalline_accent
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: section_complexity
              operator: gte
              value: 0.56
            - source: harmonic_stability
              operator: gte
              value: 0.38
        z_index: 40
        opacity: 0.28
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.50

        transform:
          anchor_from: track_identity_seed
          scale_range: [0.18, 0.38]
          scale_source: texture_complexity
          rotation_range_deg: [0.0, 360.0]
          rotation_source: harmonic_change_rate

        mapping:
          branch_count: symmetry_bias
          branch_depth: texture_complexity
          branch_jitter: noise_level
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  ambient:
    description: >
      Холодное медленное поле: разреженный julia как дрейфующий туман,
      duffing-хаос тонким подслоем, фрактальная граница через scattering,
      едва заметный orbital breath и большая пауза.

    identity:
      palette_id: lunar_mist
      macro_archetype: quiet_field
      postprocess_style_slug: fullcolor
      visual_keywords:
        - spacious
        - cold
        - submerged
        - slow

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.28, 0.58]
        direction_source: layout_macro_shape

    layers:
      - id: macro_field
        role: macro_structure
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 10
        opacity: 0.76
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.60, 1.08]
          scale_source: density_level
          rotation_range_deg: [-12.0, 12.0]
          rotation_source: motion_intensity

        mapping:
          c_real: symmetry_bias
          c_imag: tension
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          domain_zoom: motion_intensity
          stochastic_scale: noise_level

      # z15: duffing_lyapunov — тонкий хаос внутри туманного поля
      # opacity 0.10 — едва заметно, но ломает монолитность julia
      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.10
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 0.50

        mapping:
          forcing: energy
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      # z20: orbital_breath — тихое дыхание
      - id: orbital_breath
        role: meso_rhythm
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.24
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.60

        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity

      # z25: chaotic_scattering_basins — фрактальная граница формы
      # screen + opacity 0.18 — не доминирует, но создаёт живой край
      - id: edge_distortion
        role: edge_distortion
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 25
        opacity: 0.18
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.48

        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: texture_complexity
          initial_velocity_x: energy
          initial_velocity_y: motion_intensity
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: mist
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.08
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: texture_complexity

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 40
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  electronic:
    description: >
      Электрическая бифуркация: поле нелинейного напряжения,
      плотные ритмические скопления, спектральное зерно и кристаллические импульсы.

    identity:
      palette_id: spectral_neon
      macro_archetype: bifurcation_impulse
      postprocess_style_slug: grainfilm
      visual_keywords:
        - electric
        - kinetic
        - unstable
        - synthetic

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.08, 0.28]
        direction_source: layout_macro_shape

    layers:
      - id: tension_field
        role: macro_structure
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 10
        opacity: 0.86
        blend_mode: normal
        palette_id: spectral_neon
        computation_resolution_fraction: 0.75

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.80, 1.20]
          scale_source: energy
          rotation_range_deg: [-30.0, 30.0]
          rotation_source: motion_intensity

        mapping:
          forcing: energy
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      - id: pulse_density
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 20
        opacity: 0.48
        blend_mode: screen
        palette_id: spectral_neon
        computation_resolution_fraction: 0.64

        mapping:
          n_points: density_level
          map_diversity: texture_complexity
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      - id: spectral_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.12
        blend_mode: add
        palette_id: spectral_neon
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: high_frequency_energy
          frequency_scale: spectral_flatness
          color_variation: tension
          grain_size: texture_complexity

      - id: crystal_pulse
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          any:
            - source: energy
              operator: gte
              value: 0.54
            - source: section_complexity
              operator: gte
              value: 0.62
        z_index: 40
        opacity: 0.13
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.38

        mapping:
          branch_count: symmetry_bias
          branch_depth: texture_complexity
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  jazz:
    description: >
      Свободная импровизационная динамика: бассейны притяжения с хаотическими
      траекториями, лунная мгла, микрозерно и усиленный гармонический орнамент.

    identity:
      palette_id: lunar_mist
      macro_archetype: scattering_improvisation
      postprocess_style_slug: fullcolor
      visual_keywords:
        - improvisational
        - fluid
        - fragmented
        - lunar

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.18, 0.46]
        direction_source: layout_macro_shape

    layers:
      - id: scatter_base
        role: macro_structure
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 10
        opacity: 0.82
        blend_mode: normal
        palette_id: lunar_mist
        computation_resolution_fraction: 0.72

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.70, 1.10]
          scale_source: energy
          rotation_range_deg: [-20.0, 20.0]
          rotation_source: motion_intensity

        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: texture_complexity
          initial_velocity_x: energy
          initial_velocity_y: motion_intensity
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: orbital_counterpoint
        role: counterpoint
        generator_id: orbital_field
        enabled: true
        z_index: 20
        opacity: 0.26
        blend_mode: screen
        palette_id: lunar_mist
        computation_resolution_fraction: 0.56

        mapping:
          flow_speed: tempo
          orbit_radius: repetition
          line_count: density_level
          amplitude: energy
          rotation_deg: motion_intensity

      - id: jazz_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 30
        opacity: 0.09
        blend_mode: soft_light
        palette_id: lunar_mist
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: high_frequency_energy

      # snowflake: opacity 0.10→0.22, порог harmonic_stability 0.52→0.42
      # jazz имеет h_stab=0.471 — теперь орнамент включится
      - id: harmonic_ornament
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.42
        z_index: 40
        opacity: 0.22
        blend_mode: add
        palette_id: pale_gold_accent
        computation_resolution_fraction: 0.48

        mapping:
          branch_count: symmetry_bias
          branch_depth: texture_complexity
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  # classical — orbital_field строго концентрический + решётка + duffing подслой + видимая симметрия
  classical:
    description: >
      Симметричная архитектурная композиция: строгие концентрические рельсы,
      duffing-хаос multiply внутри (ломает монолит, не разрушает структуру),
      фрактальная решётка, видимый гармонический орнамент, кобальтово-слоновая палитра.

    identity:
      palette_id: ivory_cobalt
      macro_archetype: architectural_symmetry
      postprocess_style_slug: fullcolor
      visual_keywords:
        - structured
        - harmonic
        - architectural
        - luminous

    composition:
      negative_space:
        coverage_source: silence_rate
        coverage_range: [0.20, 0.50]
        direction_source: layout_macro_shape

    layers:
      # z10: orbital_field с rotation=[0,0] — строго концентрические орбиты
      - id: orbital_rails
        role: macro_structure
        generator_id: orbital_field
        enabled: true
        z_index: 10
        opacity: 0.78
        blend_mode: normal
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.80

        transform:
          offset_from: layout_macro_shape
          scale_range: [0.72, 1.12]
          scale_source: energy
          rotation_range_deg: [0.0, 0.0]
          rotation_source: motion_intensity

        mapping:
          flow_speed: tempo
          orbit_radius: harmonic_stability
          line_count: symmetry_bias
          amplitude: energy
          rotation_deg: motion_intensity

      # z15: duffing_lyapunov multiply — хаос внутри структуры
      # multiply темнит и добавляет фактуру, не светит наружу
      # opacity 0.12 — почти не заметен, но убирает пластиковость
      - id: chaos_underbody
        role: chaos_underbody
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 15
        opacity: 0.12
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.56

        mapping:
          forcing: energy
          damping: tension
          forcing_frequency: motion_intensity
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          stochastic_scale: noise_level
          gamma_window: density_level
          omega_window: density_level

      # z20: orbit_ifs_multi_trap multiply — решётчатая фрактальная структура поверх рельсов
      - id: fractal_grid
        role: meso_rhythm
        generator_id: orbit_ifs_multi_trap
        enabled: true
        z_index: 20
        opacity: 0.52
        blend_mode: multiply
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.64

        mapping:
          n_points: density_level
          map_diversity: texture_complexity
          attractor_spread: motion_intensity
          stochastic_scale: noise_level

      # z30: symmetry_snowflake opacity 0.35 screen — видимая симметрия
      - id: architectural_symmetry
        role: accent
        generator_id: symmetry_snowflake
        enabled_if:
          all:
            - source: harmonic_stability
              operator: gte
              value: 0.60
            - source: section_complexity
              operator: gte
              value: 0.48
        z_index: 30
        opacity: 0.35
        blend_mode: screen
        palette_id: ivory_cobalt
        computation_resolution_fraction: 0.50

        transform:
          anchor_from: track_identity_seed
          scale_range: [0.14, 0.36]
          scale_source: texture_complexity
          rotation_range_deg: [0.0, 360.0]
          rotation_source: harmonic_change_rate

        mapping:
          branch_count: symmetry_bias
          branch_depth: texture_complexity
          branch_jitter: noise_level
          rotation_deg: harmonic_change_rate
          radial_scale: repetition

      - id: classical_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 40
        opacity: 0.07
        blend_mode: soft_light
        palette_id: ivory_cobalt
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level
          frequency_scale: spectral_flatness
          anisotropy: repetition
          grain_size: texture_complexity

      - id: silence_mask
        role: silence_mask
        source_kind: procedural_mask
        enabled: true
        z_index: 50
        opacity: 1.0
        blend_mode: normal
        palette_id: null
        computation_resolution_fraction: 1.00

        mapping:
          coverage: silence_rate
          direction: layout_macro_shape
          edge_softness: tension

  soundtrack:
    description: >
      Кинематографическое поле: драматическая динамика, контурный контрапункт,
      локальные разломы бассейнов и глубокая атмосферная поверхность.

    identity:
      palette_id: crimson_gold_noir
      macro_archetype: cinematic_tension
      postprocess_style_slug: grainfilm
      visual_keywords:
        - dramatic
        - deep
        - cinematic
        - contrastive

    layers:
      - id: dramatic_field
        role: macro_structure
        generator_id: duffing_lyapunov
        enabled: true
        z_index: 10
        opacity: 0.80
        blend_mode: normal
        palette_id: crimson_gold_noir
        computation_resolution_fraction: 0.76

        mapping:
          forcing: energy
          damping: tension
          nonlinear_stiffness: texture_complexity
          n_steps: recursion_depth
          forcing_frequency: motion_intensity
          stochastic_scale: noise_level

      - id: contour
        role: counterpoint
        generator_id: julia_orbit_trap
        enabled: true
        z_index: 20
        opacity: 0.38
        blend_mode: screen
        palette_id: crimson_gold_noir
        computation_resolution_fraction: 0.56

        mapping:
          c_real: symmetry_bias
          c_imag: tension
          exponent_p: texture_complexity
          trap_radius: density_level
          max_iter: recursion_depth
          rotation_deg: motion_intensity

      - id: scene_break
        role: accent
        generator_id: chaotic_scattering_basins
        enabled: true
        z_index: 30
        opacity: 0.17
        blend_mode: add
        palette_id: crimson_gold_noir
        computation_resolution_fraction: 0.48

        mapping:
          scatterer_radius: density_level
          center_phase_offset: symmetry_bias
          center_radius: texture_complexity
          initial_velocity_x: energy
          max_steps: recursion_depth
          stochastic_scale: noise_level

      - id: atmospheric_grain
        role: microtexture
        generator_id: colored_noise_field
        enabled: true
        z_index: 40
        opacity: 0.07
        blend_mode: soft_light
        palette_id: crimson_gold_noir
        computation_resolution_fraction: 1.00

        mapping:
          amplitude: noise_level
          frequency_scale: spectral_flatness
          grain_size: high_frequency_energy

